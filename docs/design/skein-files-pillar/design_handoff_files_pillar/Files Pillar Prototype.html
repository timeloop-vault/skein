<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skein — Files pillar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: "Inter", system-ui, sans-serif; background: #08090b; color: #e8e6df; overflow: hidden; }
  * { box-sizing: border-box; }
  #root { height: 100vh; width: 100vw; }
  a { color: var(--accent); } a:hover { filter: brightness(1.15); }

  :root { --sk-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; --sk-sans: "Inter", system-ui, sans-serif; }
  .sk-dark {
    --bg-0:#0d0e10; --bg-1:#131418; --bg-2:#181a1f; --bg-3:#20232a; --bg-card:#14161b;
    --line:rgba(255,255,255,0.06); --line-strong:rgba(255,255,255,0.12);
    --fg-0:#e8e6df; --fg-1:#b6b3aa; --fg-2:#7a786f; --fg-3:#4a4944;
    --accent:#c96442; --ok:#7aa37f; --warn:#d4a657; --err:#c97163; --waiting:#8a96c9;
    --diff-add:rgba(122,163,127,0.18); --diff-del:rgba(201,113,99,0.16);
    --st-running:#6cb585; --st-waiting:#e0ad48; --st-idle:#82807a; --st-error:#dd685a;
    --h-claude:#c96442; --h-opencode:#5b8a72; --h-copilot:#4a6b9a; --h-byoh:#8a7a4a;
  }
  .sk-light {
    --bg-0:#f5f3ee; --bg-1:#faf8f3; --bg-2:#ffffff; --bg-3:#ece9e1; --bg-card:#ffffff;
    --line:rgba(20,18,14,0.07); --line-strong:rgba(20,18,14,0.14);
    --fg-0:#1a1814; --fg-1:#4a4740; --fg-2:#7a766c; --fg-3:#b0aca0;
    --accent:#b8513a; --ok:#547f5b; --warn:#a87a2c; --err:#a64f3f; --waiting:#5a6aa0;
    --diff-add:rgba(84,127,91,0.14); --diff-del:rgba(166,79,63,0.12);
    --st-running:#3f8a5a; --st-waiting:#b07d1f; --st-idle:#8a877e; --st-error:#c0503f;
    --h-claude:#b8513a; --h-opencode:#4a7560; --h-copilot:#3d5a85; --h-byoh:#766535;
  }
  @keyframes sk-pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  @keyframes fp-flicker { 0%,100%{opacity:.25} 50%{opacity:.9} }

  /* ── Stage / viewport (width simulator) ── */
  .fp-viewport { position: fixed; inset: 0; background: #08090b; display: flex; overflow: hidden; }
  .fp-stage { order:1; flex: 1 1 auto; min-width: 0; display: flex; }
  .sk-app { width: 100%; height: 100vh; background: var(--bg-0); color: var(--fg-0); font-family: var(--sk-sans); font-size: 12px; display: flex; flex-direction: column; overflow: hidden; letter-spacing: -0.005em; }

  /* ── Chips / dots ── */
  .chip { display:inline-flex; align-items:center; justify-content:center; font-family:var(--sk-mono); font-weight:700; color:#fff; border-radius:3px; width:14px; height:14px; font-size:8px; letter-spacing:-0.03em; flex:0 0 auto; vertical-align:middle; }
  .chip.h-claude{background:var(--h-claude)} .chip.h-opencode{background:var(--h-opencode)} .chip.h-copilot{background:var(--h-copilot)} .chip.h-byoh{background:var(--h-byoh)}
  .dot { width:8px; height:8px; border-radius:50%; flex:0 0 8px; display:inline-block; vertical-align:middle; }
  .dot.st-running{background:var(--st-running); box-shadow:0 0 6px color-mix(in srgb,var(--st-running) 70%,transparent)}
  .dot.st-waiting{background:var(--st-waiting); box-shadow:0 0 6px color-mix(in srgb,var(--st-waiting) 70%,transparent); animation:sk-pulse 1.6s ease-in-out infinite}
  .dot.st-idle{background:var(--st-idle)} .dot.st-error{background:var(--st-error); box-shadow:0 0 6px color-mix(in srgb,var(--st-error) 70%,transparent)}

  /* ── Title bar ── */
  .sk-titlebar { height:30px; flex:0 0 30px; display:flex; align-items:center; background:var(--bg-0); border-bottom:1px solid var(--line); padding:0 0 0 14px; gap:10px; }
  .sk-app-name { font-family:var(--sk-mono); font-size:11px; font-weight:500; color:var(--fg-1); letter-spacing:0.02em; }
  .sk-app-name .dot { color:var(--accent); background:none; box-shadow:none; width:auto; height:auto; }
  .sk-titlebar-session { font-family:var(--sk-mono); font-size:11px; color:var(--fg-2); }
  .sk-titlebar-session::before { content:"·"; color:var(--fg-3); margin-right:8px; }
  .sk-titlebar-actions { margin-left:auto; display:flex; align-items:center; }
  .sk-cog-btn { width:38px; height:30px; display:flex; align-items:center; justify-content:center; background:transparent; border:0; color:var(--fg-2); cursor:pointer; }
  .sk-cog-btn:hover { background:var(--bg-2); color:var(--fg-0); }

  /* ── Room tab strip ── */
  .sk-tabstrip { flex:0 0 48px; height:48px; background:var(--bg-0); border-bottom:1px solid var(--line); display:flex; align-items:stretch; padding:0 6px; gap:1px; overflow:hidden; }
  .sk-tab { display:flex; flex-direction:column; justify-content:center; padding:0 14px; height:48px; color:var(--fg-2); font-size:12px; cursor:pointer; position:relative; min-width:0; max-width:240px; border-left:1px solid transparent; border-right:1px solid transparent; gap:3px; }
  .sk-tab:hover { color:var(--fg-1); background:rgba(255,255,255,0.02); }
  .sk-tab.active { background:var(--bg-1); color:var(--fg-0); border-left-color:var(--line); border-right-color:var(--line); }
  .sk-tab.active::before { content:""; position:absolute; left:0; right:0; top:-1px; height:2px; background:var(--accent); }
  .sk-tab .row-1 { display:flex; align-items:center; gap:8px; min-width:0; }
  .sk-tab .row-2 { display:flex; align-items:center; gap:6px; font-family:var(--sk-mono); font-size:9.5px; color:var(--fg-3); }
  .sk-tab .name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sk-tab-close { color:var(--fg-3); font-size:13px; padding:0 2px; border-radius:3px; opacity:0; }
  .sk-tab:hover .sk-tab-close, .sk-tab.active .sk-tab-close { opacity:0.6; }
  .sk-tab-newbtn { height:48px; width:32px; display:flex; align-items:center; justify-content:center; color:var(--fg-2); font-family:var(--sk-mono); font-size:14px; border-left:1px solid var(--line); margin-left:2px; cursor:pointer; }
  .sk-tab-newbtn:hover { color:var(--fg-0); background:var(--bg-1); }

  /* ── Workspace ── */
  .sk-workspace { flex:1; display:flex; min-height:0; background:var(--bg-1); }
  .sk-splitter-x { flex:0 0 4px; background:var(--line); cursor:col-resize; }
  .sk-splitter-x:hover { background:var(--accent); }

  /* ── Harness column ── */
  .sk-harness-col { flex:1.4 1 0; display:flex; flex-direction:column; min-width:182px; min-height:0; overflow:hidden; background:var(--bg-1); position:relative; }
  .fp-center-slot .sk-harness-col, .sk-harness-col.embedded { flex:1; min-width:0; }
  .sk-harness-col.region-focus::after { content:""; position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent); }
  .sk-harness-tabs { flex:0 0 34px; height:34px; display:flex; align-items:stretch; padding:0 6px; gap:2px; background:var(--bg-1); border-bottom:1px solid var(--line); min-width:0; }
  .sk-harness-tablist { flex:1 1 auto; min-width:0; display:flex; align-items:stretch; gap:2px; overflow-x:auto; scrollbar-width:none; }
  .sk-harness-tablist::-webkit-scrollbar { display:none; }
  .sk-harness-tab { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:0 10px; border-radius:5px 5px 0 0; color:var(--fg-2); font-size:11.5px; cursor:pointer; position:relative; margin-top:4px; height:30px; border:1px solid transparent; border-bottom:none; }
  .sk-harness-tab.active { background:var(--bg-1); color:var(--fg-0); border-color:var(--line); }
  .sk-harness-tab .ht-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px; }
  .sk-harness-tab .ht-x { color:var(--fg-3); font-size:12px; opacity:0; }
  .sk-harness-tab:hover .ht-x, .sk-harness-tab.active .ht-x { opacity:0.6; }
  .sk-harness-add { flex:0 0 auto; align-self:center; height:24px; padding:0 9px 0 11px; margin-left:4px; border-left:1px solid var(--line); color:var(--fg-3); font-family:var(--sk-mono); font-size:11px; white-space:nowrap; cursor:pointer; border-radius:4px; display:flex; align-items:center; }
  .sk-harness-add:hover { color:var(--fg-1); background:var(--bg-2); }
  .sk-harness-meta { flex:0 0 auto; margin-left:12px; align-self:center; font-family:var(--sk-mono); font-size:10px; color:var(--fg-2); white-space:nowrap; padding-right:8px; }
  .sk-harness-tab.files.active { background:color-mix(in srgb,var(--accent) 8%,var(--bg-1)); }
  .sk-harness-tab .ht-files-glyph { color:var(--accent); font-size:12px; line-height:1; flex:0 0 auto; }
  .ht-livepip { width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 6px var(--accent); animation:sk-pulse 1.5s ease-in-out infinite; flex:0 0 6px; margin-left:2px; }
  /* + harness menu (portalled) */
  .shm-scrim { position:fixed; inset:0; z-index:700; }
  .sk-harness-menu { position:fixed; min-width:176px; background:var(--bg-1); border:1px solid var(--line-strong); border-radius:9px; box-shadow:0 16px 48px rgba(0,0,0,0.5); padding:5px; }
  .shm-cap { font-family:var(--sk-mono); font-size:8.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--fg-3); padding:5px 9px 6px; }
  .shm-item { display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:6px; cursor:pointer; color:var(--fg-1); font-family:var(--sk-mono); font-size:11.5px; }
  .shm-item:hover { background:var(--bg-3); color:var(--fg-0); }
  .shm-item .shm-glyph { width:14px; text-align:center; color:var(--accent); font-size:12px; }
  .shm-item .shm-tag { margin-left:auto; font-size:8.5px; color:var(--fg-3); background:var(--bg-3); border-radius:3px; padding:1px 5px; }
  .shm-sep { height:1px; background:var(--line); margin:5px 6px; }
  .sk-shell-body { padding:12px 16px; }
  .crumb-empty { color:var(--fg-3); }
  .fps-btn:disabled { opacity:0.35; cursor:default; }
  /* director model note */
  .fpc-model { font-size:11px; line-height:1.5; color:#b6b3aa; background:rgba(201,100,66,0.10); border:1px solid rgba(201,100,66,0.28); border-radius:8px; padding:9px 10px; }
  .fpc-model b { color:#e8e6df; }
  .fpc-model .kbdlike { font-family:var(--sk-mono); font-size:10px; background:rgba(255,255,255,0.08); border-radius:3px; padding:1px 5px; color:#e8e6df; }

  .sk-term { flex:1; min-height:0; overflow-y:auto; padding:10px 16px 0; font-family:var(--sk-mono); font-size:13px; line-height:1.52; background:var(--bg-1); color:var(--fg-1); white-space:pre-wrap; word-break:break-word; scrollbar-width:thin; scrollbar-color:var(--bg-3) transparent; }
  .sk-term::-webkit-scrollbar{width:9px} .sk-term::-webkit-scrollbar-thumb{background:var(--bg-3); border-radius:5px}
  .t-line { display:block; min-height:1.52em; }
  .t-dim{color:var(--fg-3)} .t-muted{color:var(--fg-2)} .t-bold{color:var(--fg-0); font-weight:600}
  .t-accent{color:var(--accent)} .t-bullet{color:var(--accent)} .t-cogit{color:var(--accent)}
  .t-spacer{display:block; height:1.52em}
  .blink::after{content:"▍"; color:var(--accent); animation:sk-pulse 1.1s ease-in-out infinite}
  .t-inputblock{border:1px solid var(--line-strong); border-radius:5px; margin:6px 0 0; padding:8px 10px; color:var(--fg-2); display:flex; align-items:center; gap:8px}
  .t-cursorblock{display:inline-block; width:8px; height:15px; background:var(--accent); animation:sk-pulse 1.1s ease-in-out infinite; vertical-align:middle}
  .focus-files .sk-term .blink::after, .focus-files .sk-term .t-cursorblock, .focus-files .t-inputblock .t-cursorblock { opacity:0.22; animation:none; }
  .sk-term-foot { flex:0 0 auto; border-top:1px solid var(--line); background:var(--bg-1); padding:6px 16px 8px; font-family:var(--sk-mono); font-size:11.5px; color:var(--fg-2); display:flex; flex-direction:column; gap:3px; }
  .sk-term-foot .row{display:flex; align-items:center; gap:8px} .sk-term-foot .mode{color:var(--fg-1)} .sk-term-foot .auto{color:var(--accent)} .sk-term-foot .slash{color:var(--fg-3); margin-left:auto}

  /* ── Right pane / Live Context ── */
  .sk-right { flex:1.05 1 0; display:flex; flex-direction:column; background:var(--bg-1); min-width:212px; min-height:0; }
  .lc-pane { background:var(--bg-1); color:var(--fg-0); display:flex; flex-direction:column; flex:1; min-height:0; overflow:hidden; }
  .lc-subtitle { flex:0 0 auto; padding:9px 12px 10px; background:var(--bg-0); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  .lc-subtitle .glyph { color:var(--accent); font-family:var(--sk-mono); font-size:9.5px; letter-spacing:0.04em; text-transform:uppercase; flex:0 0 auto; }
  .lc-subtitle .text { color:var(--fg-1); font-size:11.5px; line-height:1.45; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lc-subtitle .meta { color:var(--fg-3); font-family:var(--sk-mono); font-size:9.5px; flex:0 0 auto; }
  .lc-subtitle .lc-collapse { color:var(--fg-3); cursor:pointer; font-size:13px; padding:0 2px; }
  .lc-subtitle .lc-collapse:hover { color:var(--fg-0); }
  .lc-stack { flex:1; min-height:0; display:flex; flex-direction:column; }
  .lc-divider { flex:0 0 6px; height:6px; cursor:row-resize; position:relative; }
  .lc-divider::before { content:""; position:absolute; left:0; right:0; top:2px; height:1px; background:var(--line); }
  .lc-divider:hover::before { background:var(--accent); height:2px; top:1.5px; }
  .lc-card { background:var(--bg-card); display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .lc-card-head { flex:0 0 30px; height:30px; padding:0 12px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); background:var(--bg-0); }
  .lc-card-head .chev{color:var(--fg-3); font-size:9px}
  .lc-card-head .label{font-family:var(--sk-mono); font-size:9.5px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--fg-1)}
  .lc-card-head .meta{margin-left:auto; font-family:var(--sk-mono); font-size:10px; color:var(--fg-2); display:flex; gap:8px; align-items:center}
  .lc-card-head .meta .pulse{width:6px; height:6px; border-radius:50%; background:var(--ok); box-shadow:0 0 6px var(--ok)}
  .lc-card-head .meta .dim{color:var(--fg-3)}
  .lc-card-body { flex:1; min-height:0; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--bg-3) transparent; }
  .lc-card-body::-webkit-scrollbar{width:7px} .lc-card-body::-webkit-scrollbar-thumb{background:var(--bg-3); border-radius:4px}

  .lc-diff { display:flex; flex-direction:column; height:100%; }
  .lc-diff-tabs { flex:0 0 28px; height:28px; display:flex; align-items:stretch; border-bottom:1px solid var(--line); padding:0 6px; gap:2px; overflow-x:auto; scrollbar-width:none; }
  .lc-diff-tabs::-webkit-scrollbar{display:none}
  .lc-diff-tab { display:flex; align-items:center; gap:6px; padding:0 10px; color:var(--fg-2); font-family:var(--sk-mono); font-size:10.5px; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; flex:0 0 auto; position:relative; }
  .lc-diff-tab:hover{color:var(--fg-1)}
  .lc-diff-tab.active{color:var(--fg-0); border-bottom-color:var(--accent)}
  .lc-diff-tab.flicker::before{content:""; position:absolute; left:0; right:0; top:0; height:2px; background:var(--accent); animation:fp-flicker 1.4s ease-in-out infinite}
  .lc-diff-tab .da{color:var(--ok); font-size:9.5px} .lc-diff-tab .dd{color:var(--err); font-size:9.5px}
  .lc-diff-body { flex:1; min-height:0; overflow-y:auto; }
  .lc-minihunk { padding:8px 10px; font-family:var(--sk-mono); font-size:10.5px; line-height:1.55; }
  .mh-line { display:flex; gap:8px; white-space:pre; padding:1px 4px; border-radius:2px; }
  .mh-ln { width:22px; text-align:right; color:var(--fg-3); flex:0 0 22px; }
  .mh-line.ctx{color:var(--fg-2)} .mh-line.add{background:var(--diff-add); color:var(--fg-0)} .mh-line.add .mh-ln{color:var(--ok)}
  .mh-line.del{background:var(--diff-del); color:var(--fg-1)} .mh-line.del .mh-ln{color:var(--err)}
  .mh-hint{margin-top:10px; color:var(--fg-3); font-size:10px}

  .lc-plan { padding:8px 10px; display:flex; flex-direction:column; gap:5px; font-family:var(--sk-mono); font-size:11px; }
  .lc-plan-row { display:flex; align-items:center; gap:8px; color:var(--fg-1); }
  .lc-plan-row .box { width:12px; height:12px; border:1px solid var(--line-strong); border-radius:2px; font-size:9px; display:flex; align-items:center; justify-content:center; flex:0 0 12px; }
  .lc-plan-row.done{color:var(--fg-3); text-decoration:line-through} .lc-plan-row.done .box{background:var(--ok); border-color:var(--ok); color:#fff}
  .lc-plan-row.now{color:var(--fg-0); font-weight:500} .lc-plan-row.now .box{border-color:var(--accent); color:var(--accent)}

  .lc-activity { padding:2px 0; display:flex; flex-direction:column; }
  .lc-row { display:grid; grid-template-columns:54px 20px 1fr auto; align-items:baseline; gap:8px; padding:3px 12px; font-family:var(--sk-mono); font-size:11px; line-height:1.5; color:var(--fg-1); border-left:2px solid transparent; }
  .lc-row:hover{background:rgba(255,255,255,0.02)}
  .lc-row .time{color:var(--fg-3); font-size:9.5px; align-self:center}
  .lc-row .by{display:flex; align-items:center; align-self:center}
  .lc-row .gist{min-width:0} .lc-row .gist .glyph{display:inline-block; width:12px; text-align:center; margin-right:6px}
  .lc-row .gist .tool{color:var(--fg-2)} .lc-row .gist .target{color:var(--fg-0)}
  .lc-row .right{font-family:var(--sk-mono); font-size:9.5px; color:var(--fg-3); align-self:center; white-space:nowrap}
  .lc-row.k-user{border-left-color:var(--accent); background:color-mix(in srgb,var(--accent) 4%,transparent)}
  .gc-ok{color:var(--ok)} .gc-fg3{color:var(--fg-3)} .gc-accent{color:var(--accent)} .gc-warn{color:var(--warn)} .gc-waiting{color:var(--waiting)}
  .lc-tail{padding:8px 12px 14px; display:flex; align-items:center; gap:8px; font-family:var(--sk-mono); font-size:10px; color:var(--fg-3)}
  .lc-tail .blinker{width:6px; height:6px; border-radius:50%; background:var(--ok); box-shadow:0 0 6px var(--ok); animation:sk-pulse 1.6s ease-in-out infinite}

  /* ── Live Context peek rail ── */
  .lc-peek { flex:0 0 46px; background:var(--bg-0); border-left:1px solid var(--line); display:flex; flex-direction:column; align-items:center; padding:12px 0; gap:12px; cursor:pointer; }
  .lc-peek:hover { background:var(--bg-1); }
  .lc-peek-label { writing-mode:vertical-rl; transform:rotate(180deg); font-family:var(--sk-mono); font-size:9.5px; letter-spacing:0.14em; color:var(--fg-2); text-transform:uppercase; }
  .lc-peek-pips { margin-top:auto; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .lc-peek-count { font-family:var(--sk-mono); font-size:11px; color:var(--fg-0); }
  .lc-peek-sub { font-family:var(--sk-mono); font-size:8px; color:var(--fg-3); text-transform:uppercase; }
  .lc-peek-chev { color:var(--fg-3); font-size:14px; }

  /* ════════ File surface ════════ */
  .fp-surface { flex:1.75 1 0; min-width:298px; min-height:0; display:flex; flex-direction:column; background:var(--bg-1); position:relative; border-left:1px solid var(--line); }
  .fp-center-body .fp-surface, .fp-surface.embedded { flex:1; min-width:0; border-left:0; }
  .fp-surface.region-focus::after { content:""; position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent); z-index:5; }
  .fp-surface-head { flex:0 0 30px; height:30px; display:flex; align-items:center; gap:10px; padding:0 8px 0 12px; border-bottom:1px solid var(--line); background:var(--bg-0); }

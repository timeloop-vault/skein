<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="t d">
<title id="t">Cross-daemon routing (Phase 3b)</title>
<desc id="d">A director room on the local skeind talks to a worker room on the remote skeind through a daemon-to-daemon link that the local daemon dials out. Harnesses only ever talk to their own daemon. When the laptop sleeps, replies queue on the remote skeind and are delivered on reconnect.</desc>
<style>
:root{--bg:#faf8f3;--fg:#1a1814;--fg2:#4a4740;--line:#9a968a;--mach:#ece9e1;--client:#5a6aa0;--skeind:#547f5b;--harness:#a87a2c;--bad:#a64f3f}
@media (prefers-color-scheme: dark){:root{--bg:#131418;--fg:#e8e6df;--fg2:#b6b3aa;--line:#6a685f;--mach:#1b1d22;--client:#8a96c9;--skeind:#7aa37f;--harness:#d4a657;--bad:#c97163}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--fg)}
.bg{fill:var(--bg)}
.mach{fill:var(--mach);stroke:var(--line);stroke-width:1.5}
.k-client{fill:var(--client);fill-opacity:.15;stroke:var(--client);stroke-width:1.6}
.k-skeind{fill:var(--skeind);fill-opacity:.15;stroke:var(--skeind);stroke-width:1.6}
.k-harness{fill:var(--harness);fill-opacity:.18;stroke:var(--harness);stroke-width:1.6}
.k-bad{fill:var(--bad);fill-opacity:.14;stroke:var(--bad);stroke-width:1.8}
.k-n{fill:none;stroke:var(--line);stroke-width:1.4}
.dash{stroke-dasharray:6 4}
.ghost{opacity:.5}
.h{font-weight:600}
.s{fill:var(--fg2);font-size:12px}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.halo{stroke:var(--bg);stroke-width:5;paint-order:stroke;stroke-linejoin:round}
.bad{fill:var(--bad)}
.big{font-size:15px;font-weight:600}
.ln{fill:none;stroke:var(--fg2);stroke-width:1.7}
.ln-s{fill:none;stroke:var(--skeind);stroke-width:1.9}
.ln-b{fill:none;stroke:var(--bad);stroke-width:1.9}
.ah{fill:var(--fg2)}.ah-s{fill:var(--skeind)}.ah-b{fill:var(--bad)}
.dot-client{fill:var(--client)}.dot-skeind{fill:var(--skeind)}.dot-harness{fill:var(--harness)}.dot-bad{fill:var(--bad)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-s" d="M0 0L10 5L0 10z"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-b" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="900" height="620"/>
<text x="20" y="14" class="big">A. Both online</text>
<g><rect class="mach" x="20" y="26" width="340" height="250" rx="14"/><text x="36" y="50" class="h">Laptop</text>
</g>
<g><rect class="mach" x="540" y="26" width="340" height="250" rx="14"/><text x="556" y="50" class="h">Home server / VM</text>
</g>
<g><rect class="k-skeind" x="36" y="66" width="308" height="100" rx="8"/><text x="48" y="88" class="h">Local skeind</text>
</g>
<g><rect class="k-skeind" x="52" y="100" width="200" height="26" rx="13"/><text x="152.0" y="117.5" text-anchor="middle">room: director</text>
</g>
<g><rect class="k-skeind" x="556" y="66" width="308" height="100" rx="8"/><text x="568" y="88" class="h">Remote skeind</text>
</g>
<g><rect class="k-skeind" x="572" y="100" width="200" height="26" rx="13"/><text x="672.0" y="117.5" text-anchor="middle">room: worker</text>
</g>
<g><rect class="k-harness" x="52" y="196" width="200" height="26" rx="13"/><text x="152.0" y="213.5" text-anchor="middle">Claude Code (director)</text>
</g>
<g><rect class="k-harness" x="572" y="196" width="200" height="26" rx="13"/><text x="672.0" y="213.5" text-anchor="middle">Claude Code (worker)</text>
</g>
<path class="ln" d="M152 196 L152 166" marker-end="url(#a)"/>
<path class="ln" d="M672 196 L672 166" marker-end="url(#a)"/>
<text x="160" y="186" class="s halo">MCP</text><text x="160" y="186" class="s">MCP</text>
<text x="680" y="186" class="s halo">MCP</text><text x="680" y="186" class="s">MCP</text>
<path class="ln-s" d="M344 116 L556 116" marker-end="url(#as)" marker-start="url(#as)"/>
<text x="450" y="62" class="s halo" text-anchor="middle">daemon-to-daemon link</text><text x="450" y="62" class="s" text-anchor="middle">daemon-to-daemon link</text>
<text x="450" y="77" class="s halo" text-anchor="middle">local dials out</text><text x="450" y="77" class="s" text-anchor="middle">local dials out</text>
<text x="450" y="142" class="s halo" text-anchor="middle">mail, create_room,</text><text x="450" y="142" class="s" text-anchor="middle">mail, create_room,</text>
<text x="450" y="157" class="s halo" text-anchor="middle">close_room, open_harness,</text><text x="450" y="157" class="s" text-anchor="middle">close_room, open_harness,</text>
<text x="450" y="172" class="s halo" text-anchor="middle">close_harness</text><text x="450" y="172" class="s" text-anchor="middle">close_harness</text>
<text x="450" y="187" class="s halo" text-anchor="middle">no terminal bytes</text><text x="450" y="187" class="s" text-anchor="middle">no terminal bytes</text>
<text x="20" y="334" class="big">B. Laptop asleep: store-and-forward</text>
<g class="ghost"><rect class="mach dash" x="20" y="346" width="340" height="250" rx="14"/><text x="36" y="370" class="h">Laptop (asleep)</text>
</g>
<g><rect class="mach" x="540" y="346" width="340" height="250" rx="14"/><text x="556" y="370" class="h">Home server / VM</text>
</g>
<g class="ghost"><rect class="k-skeind dash" x="36" y="386" width="308" height="100" rx="8"/><text x="48" y="408" class="h">Local skeind</text>
</g>
<g class="ghost"><rect class="k-skeind dash" x="52" y="420" width="200" height="26" rx="13"/><text x="152.0" y="437.5" text-anchor="middle">room: director</text>
</g>
<g><rect class="k-skeind" x="556" y="386" width="308" height="150" rx="8"/><text x="568" y="408" class="h">Remote skeind</text>
</g>
<g><rect class="k-skeind" x="572" y="420" width="200" height="26" rx="13"/><text x="672.0" y="437.5" text-anchor="middle">room: worker</text>
</g>
<g><rect class="k-bad" x="572" y="460" width="276" height="26" rx="13"/><text x="710.0" y="477.5" text-anchor="middle">outbox: reply to director (queued)</text>
</g>
<g><rect class="k-harness" x="572" y="562" width="200" height="26" rx="13"/><text x="672.0" y="579.5" text-anchor="middle">Claude Code (worker)</text>
</g>
<path class="ln" d="M672 562 L672 536" marker-end="url(#a)"/>
<path class="ln-b dash" d="M556 435 L344 435" marker-end="url(#ab)"/>
<text x="450" y="408" class="bad halo" text-anchor="middle">link down</text><text x="450" y="408" class="bad" text-anchor="middle">link down</text>
<text x="450" y="454" class="s halo" text-anchor="middle">delivered on reconnect,</text><text x="450" y="454" class="s" text-anchor="middle">delivered on reconnect,</text>
<text x="450" y="469" class="s halo" text-anchor="middle">create/close verbs fail:</text><text x="450" y="469" class="s" text-anchor="middle">create/close verbs fail:</text>
<text x="450" y="484" class="s halo" text-anchor="middle">daemon offline</text><text x="450" y="484" class="s" text-anchor="middle">daemon offline</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" role="img" aria-labelledby="t d">
<title id="t">Local and remote rooms (Phase 3)</title>
<desc id="d">A laptop runs the client and a local skeind with rooms A and B. A home server or VM runs a remote skeind with rooms C and D. The client reaches the remote skeind over WebSocket on a private overlay network with a device token. Each harness talks MCP to the skeind on its own host.</desc>
<style>
:root{--bg:#faf8f3;--fg:#1a1814;--fg2:#4a4740;--line:#9a968a;--mach:#ece9e1;--client:#5a6aa0;--skeind:#547f5b;--harness:#a87a2c;--bad:#a64f3f}
@media (prefers-color-scheme: dark){:root{--bg:#131418;--fg:#e8e6df;--fg2:#b6b3aa;--line:#6a685f;--mach:#1b1d22;--client:#8a96c9;--skeind:#7aa37f;--harness:#d4a657;--bad:#c97163}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:var(--fg)}
.bg{fill:var(--bg)}
.mach{fill:var(--mach);stroke:var(--line);stroke-width:1.5}
.k-client{fill:var(--client);fill-opacity:.15;stroke:var(--client);stroke-width:1.6}
.k-skeind{fill:var(--skeind);fill-opacity:.15;stroke:var(--skeind);stroke-width:1.6}
.k-harness{fill:var(--harness);fill-opacity:.18;stroke:var(--harness);stroke-width:1.6}
.k-bad{fill:var(--bad);fill-opacity:.14;stroke:var(--bad);stroke-width:1.8}
.k-n{fill:none;stroke:var(--line);stroke-width:1.4}
.dash{stroke-dasharray:6 4}
.ghost{opacity:.5}
.h{font-weight:600}
.s{fill:var(--fg2);font-size:12px}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.halo{stroke:var(--bg);stroke-width:5;paint-order:stroke;stroke-linejoin:round}
.bad{fill:var(--bad)}
.big{font-size:15px;font-weight:600}
.ln{fill:none;stroke:var(--fg2);stroke-width:1.7}
.ln-s{fill:none;stroke:var(--skeind);stroke-width:1.9}
.ln-b{fill:none;stroke:var(--bad);stroke-width:1.9}
.ah{fill:var(--fg2)}.ah-s{fill:var(--skeind)}.ah-b{fill:var(--bad)}
.dot-client{fill:var(--client)}.dot-skeind{fill:var(--skeind)}.dot-harness{fill:var(--harness)}.dot-bad{fill:var(--bad)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-s" d="M0 0L10 5L0 10z"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-b" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="900" height="630"/>
<g><rect class="mach" x="20" y="20" width="380" height="590" rx="14"/><text x="36" y="44" class="h">Laptop</text>
</g>
<g><rect class="mach" x="520" y="20" width="360" height="590" rx="14"/><text x="536" y="44" class="h">Home server / VM</text>
</g>
<g><rect class="k-client" x="40" y="56" width="340" height="90" rx="8"/><text x="52" y="78" class="h">Skein client</text>
<text x="52" y="97" class="s">UI only; connects to every</text>
<text x="52" y="114" class="s">daemon directly</text>
</g>
<g><rect class="k-skeind" x="40" y="230" width="340" height="150" rx="8"/><text x="52" y="252" class="h">Local skeind</text>
<text x="52" y="271" class="s">PTYs, tails, review, agent API</text>
</g>
<g><rect class="k-skeind" x="56" y="300" width="140" height="26" rx="13"/><text x="126.0" y="317.5" text-anchor="middle">room A</text>
</g>
<g><rect class="k-skeind" x="224" y="300" width="140" height="26" rx="13"/><text x="294.0" y="317.5" text-anchor="middle">room B</text>
</g>
<path class="ln-s" d="M210 146 L210 230" marker-end="url(#as)" marker-start="url(#as)"/>
<text x="215" y="196" class="s halo">local socket</text><text x="215" y="196" class="s">local socket</text>
<g><rect class="k-skeind" x="540" y="230" width="320" height="150" rx="8"/><text x="552" y="252" class="h">Remote skeind</text>
<text x="552" y="271" class="s">PTYs, tails, review, agent API</text>
</g>
<g><rect class="k-skeind" x="556" y="300" width="130" height="26" rx="13"/><text x="621.0" y="317.5" text-anchor="middle">room C</text>
</g>
<g><rect class="k-skeind" x="704" y="300" width="140" height="26" rx="13"/><text x="774.0" y="317.5" text-anchor="middle">room D</text>
</g>
<g><rect class="k-n" x="716" y="56" width="144" height="66" rx="8"/><text x="728" y="78" class="h">Workspace root</text>
<text x="728" y="97" class="s">main checkouts</text>
</g>
<path class="ln dash" d="M788 122 L788 230" marker-end="url(#a)"/>
<text x="796" y="180" class="s halo">worktrees</text><text x="796" y="180" class="s">worktrees</text>
<path class="ln-s" d="M380 101 L700 101 L700 230" marker-end="url(#as)" marker-start="url(#as)"/>
<text x="460" y="76" class="s halo" text-anchor="middle">WebSocket over</text><text x="460" y="76" class="s" text-anchor="middle">WebSocket over</text>
<text x="460" y="91" class="s halo" text-anchor="middle">private overlay</text><text x="460" y="91" class="s" text-anchor="middle">private overlay</text>
<text x="460" y="106" class="s halo" text-anchor="middle">device token</text><text x="460" y="106" class="s" text-anchor="middle">device token</text>
<g><rect class="k-harness" x="40" y="470" width="160" height="26" rx="13"/><text x="120.0" y="487.5" text-anchor="middle">Claude Code, room A</text>
</g>
<g><rect class="k-harness" x="214" y="470" width="166" height="26" rx="13"/><text x="297.0" y="487.5" text-anchor="middle">opencode, room B</text>
</g>
<path class="ln" d="M120 470 L120 380" marker-end="url(#a)"/>
<path class="ln" d="M290 470 L290 380" marker-end="url(#a)"/>
<g><rect class="k-harness" x="540" y="500" width="160" height="26" rx="13"/><text x="620.0" y="517.5" text-anchor="middle">Claude Code, room C</text>
</g>
<g><rect class="k-harness" x="714" y="500" width="146" height="26" rx="13"/><text x="787.0" y="517.5" text-anchor="middle">opencode, room D</text>
</g>
<path class="ln" d="M620 500 L620 380" marker-end="url(#a)"/>
<path class="ln" d="M787 500 L787 380" marker-end="url(#a)"/>
<text x="132" y="430" class="s halo">MCP + hooks</text><text x="132" y="430" class="s">MCP + hooks</text>
<text x="132" y="445" class="s halo">127.0.0.1</text><text x="132" y="445" class="s">127.0.0.1</text>
<text x="630" y="468" class="s halo">MCP + hooks, 127.0.0.1</text><text x="630" y="468" class="s">MCP + hooks, 127.0.0.1</text>
<text x="210" y="560" class="s" text-anchor="middle">Each harness talks to the skeind</text>
<text x="210" y="577" class="s" text-anchor="middle">next to it, never across the network.</text>
<text x="700" y="560" class="s" text-anchor="middle">Same rule on the server. No reverse tunnels.</text>

</svg>

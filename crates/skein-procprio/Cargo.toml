[package]
name = "skein-procprio"
version = "0.1.0"
description = "Lower the CPU priority of an already-spawned child process by pid (Windows priority class, Unix niceness)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Like skein-winnotify and skein-webshot, a deliberate exception to the
# workspace's `unsafe_code = "forbid"`: the Win32 priority-class calls
# cannot be made safe. Every unsafe block must carry a `// SAFETY:`
# comment (`undocumented_unsafe_blocks = "deny"`). The Unix side uses
# rustix's safe wrappers and needs no unsafe at all.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
undocumented_unsafe_blocks = "deny"

# Same major as the windows crate already locked, so one copy resolves.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = [
    "std",
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["process", "std"] }

[package]
name = "skein-sysload"
version = "0.1.0"
description = "Cheap system load sampling (CPU %, system-drive busy % and queue length) via Windows PDH counters (#639)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Like skein-winnotify and skein-webshot, a deliberate exception to the
# workspace's `unsafe_code = "forbid"`: the PDH performance-counter API is
# a raw Win32 FFI surface that cannot be made safe. Every unsafe block must
# carry a `// SAFETY:` comment (`undocumented_unsafe_blocks = "deny"`).
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
undocumented_unsafe_blocks = "deny"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Performance"] }
